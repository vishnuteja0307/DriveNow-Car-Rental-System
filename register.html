<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | DriveNow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <a class="logo centered" href="index.html">Drive<span>Now</span></a>
    <h1>Create account</h1>
    <p class="muted">Join DriveNow and start renting cars.</p>

    <form id="registerForm">
      <label>Full Name</label>
      <input id="registerName" type="text" placeholder="Enter your name" required>
      <label>Email</label>
      <input id="registerEmail" type="email" placeholder="Enter your email" required>
      <label>Password</label>
      <input id="registerPassword" type="password" minlength="6" placeholder="Minimum 6 characters" required>
      <label>Confirm Password</label>
      <input id="confirmPassword" type="password" placeholder="Re-enter password" required>
      <button class="btn btn-red full" type="submit">Create Account</button>
      <p id="registerMessage" class="message"></p>
    </form>

    <p class="auth-bottom">Already have an account? <a href="login.html">Login</a></p>
    <a class="back-link" href="index.html">← Back to home</a>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
