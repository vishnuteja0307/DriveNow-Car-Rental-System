<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | DriveNow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar dashboard-nav">
    <a class="logo" href="admin.html">Drive<span>Now</span> <small>ADMIN</small></a>
    <div class="nav-user">
      <span>Administrator</span>
      <button class="btn btn-dark" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="dashboard">
    <section class="dashboard-header">
      <div>
        <p class="eyebrow">ADMIN PANEL</p>
        <h1>Manage DriveNow</h1>
        <p class="muted">Add, edit and remove vehicles from the rental system.</p>
      </div>
      <button class="btn btn-red" onclick="openCarForm()">+ Add Car</button>
    </section>

    <section class="stats-grid">
      <div class="stat-card"><span>Total Cars</span><strong id="totalCars">0</strong></div>
      <div class="stat-card"><span>Available</span><strong id="availableCars">0</strong></div>
      <div class="stat-card"><span>Bookings</span><strong id="totalBookings">0</strong></div>
      <div class="stat-card"><span>Users</span><strong id="totalUsers">0</strong></div>
    </section>

    <section class="admin-table-wrap">
      <h2>Car Inventory</h2>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Car</th><th>Type</th><th>Price/Day</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="adminCarsTable"></tbody>
        </table>
      </div>
    </section>

    <section class="admin-table-wrap">
      <h2>Bookings</h2>
      <div class="table-scroll">
        <table>
          <thead><tr><th>User</th><th>Car</th><th>Dates</th><th>Total</th></tr></thead>
          <tbody id="bookingsTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="carFormModal" class="modal hidden">
    <div class="modal-card">
      <button class="close" onclick="closeCarForm()">×</button>
      <h2 id="carFormTitle">Add Car</h2>
      <form id="carForm">
        <input id="editCarId" type="hidden">
        <label>Car Name</label>
        <input id="carName" type="text" placeholder="e.g. Honda City" required>
        <label>Type</label>
        <select id="carType" required>
          <option value="Sedan">Sedan</option>
          <option value="SUV">SUV</option>
          <option value="Hatchback">Hatchback</option>
          <option value="Luxury">Luxury</option>
        </select>
        <label>Price Per Day (₹)</label>
        <input id="carPrice" type="number" min="1" required>
        <label>Image URL</label>
        <input id="carImage" type="url" placeholder="https://...">
        <label>Description</label>
        <textarea id="carDescription" rows="3" placeholder="Short car description"></textarea>
        <button class="btn btn-red full" type="submit">Save Car</button>
        <p id="carFormMessage" class="message"></p>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
