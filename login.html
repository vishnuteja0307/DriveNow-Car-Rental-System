<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | DriveNow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <a class="logo centered" href="index.html">Drive<span>Now</span></a>
    <h1>Welcome back</h1>
    <p class="muted">Login to continue to DriveNow.</p>

    <form id="loginForm">
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="Enter your email" required>
      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="Enter your password" required>
      <button class="btn btn-red full" type="submit">Login</button>
      <p id="loginMessage" class="message"></p>
    </form>

    <div class="demo-box">
      <strong>Admin demo</strong><br>
      Email: admin@drivenow.com<br>
      Password: admin123
    </div>

    <p class="auth-bottom">Don't have an account? <a href="register.html">Register</a></p>
    <a class="back-link" href="index.html">← Back to home</a>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
